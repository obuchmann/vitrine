# Release builds (docs/adr/0004-platforms-and-distribution.md). Archive names
# carry no version, so install scripts can use releases/latest/download/.
version: 2
project_name: vitrine

builds:
  - main: ./cmd/vitrine
    binary: vitrine
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# Keyless signature of the checksums with the GitHub Actions identity.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

release:
  draft: true
  prerelease: auto
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1

changelog:
  use: github-native
